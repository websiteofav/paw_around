<!DOCTYPE html>
<html>

<head>

  <!-- Base -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- Primary Meta -->
  <title>Paw Around | Smart Pet Care for Pets</title>
  <meta name="description" content="Paw Around – QR pet ID, smart pet care reminders, nearby vets, lost & found.">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#00C8A6">

  <!-- Apple / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paw Around">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Canonical -->
  <link rel="canonical" href="https://pawaround.in">

  <!-- Open Graph (Social Share) -->
  <meta property="og:title" content="Paw Around – Smart Pet Care">
  <meta property="og:description"
    content="Paw Around – QR pet ID, smart pet care reminders, nearby vets, lost & found.">
  <meta property="og:image" content="https://pawaround.in/og-image.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pawaround.in">

  <!-- Twitter Card (Share Preview) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paw Around – Smart Pet Care">
  <meta name="twitter:description"
    content="Paw Around – QR pet ID, smart pet care reminders, nearby vets, lost & found.">
  <meta name="twitter:image" content="https://pawaround.in/og-image.png">

  <!-- Splash Background Styling -->
  <style>
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #00C8A6;
      /* Change if brand color differs */
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

</head>

<body>

  <!-- Splash Screen -->
  <picture id="splash">
    <source
      srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light)">
    <source
      srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">
    <img class="center" src="splash/img/light-1x.png" alt="Paw Around">
  </picture>

  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
