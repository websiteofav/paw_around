name: paw_around
description: "A new Flutter project."
publish_to: "none"
version: 1.0.5+11

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: 1.0.2
  flutter_bloc: 9.1.1
  go_router: 14.2.7
  equatable: 2.0.5
  hive_ce: 2.16.0
  hive_ce_flutter: 2.3.3
  provider: 6.1.1
  get_it: 7.6.4
  image_picker: 1.0.7
  path_provider: 2.1.5
  permission_handler: 11.3.1
  google_maps_flutter: 2.14.0
  geolocator: 14.0.2
  geocoding: 4.0.0
  http: 1.6.0
  flutter_dotenv: 6.0.0
  url_launcher: 6.3.2
  firebase_core: 4.3.0
  cloud_firestore: 6.1.0
  firebase_auth: 6.1.2
  firebase_storage: 13.0.4
  firebase_app_check: 0.4.1+3
  cached_network_image: 3.4.1
  intl_phone_field: 3.2.0
  pin_code_fields: 8.0.1
  google_sign_in: 6.2.2
  lottie: 3.3.2
  flutter_svg: 2.2.3
  flutter_local_notifications: 19.5.0
  shared_preferences: 2.5.4
  google_fonts: 6.3.3
  firebase_analytics: 12.1.0
  firebase_crashlytics: 5.0.6
  flutter_native_splash: 2.4.7
  app_links: 6.4.1
  share_plus: 12.0.1
  qr_flutter: 4.1.0
  font_awesome_flutter: 10.7.0
  firebase_messaging: 16.1.0
  shimmer: 3.0.0
  flutter_ruler_picker: 1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  hive_ce_generator: 1.11.0
  build_runner: 2.10.4
  change_app_package_name: 1.4.0
  flutter_launcher_icons: 0.14.4

  

flutter_native_splash:
  color: "#00C8A6"
  image: assets/app_icon.png
  fullscreen: true
  android_12:
    color: "#00C8A6"
    image: assets/app_icon.png
  ios: true
  android: true


flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  android: true
  remove_alpha_ios: true   # ← add this
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#00C8A6"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/intro/
    - assets/auth/
    - assets/home/
    - assets/pets/
    - assets/posts/
    - assets/web/
    - .env
